name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: internez
          POSTGRES_PASSWORD: internez
          POSTGRES_DB: internez_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U internez"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://internez:internez@localhost:5432/internez_test
      DATABASE_SSL: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Informational for now, not blocking — see the two known findings
      # (dev-only vite/esbuild chain, react-router-dom) tracked to be
      # resolved as their own dedicated, tested upgrades rather than forced
      # through here. Once those land, drop continue-on-error to make this
      # a real gate.
      - run: npm audit --audit-level=high
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high
        continue-on-error: true
      # Cloudflare Pages has no git integration for this project (it was
      # created via direct upload, not "Connect to Git" — see
      # `wrangler pages project list`, which shows Git Provider: No), so
      # deploys were manual (`wrangler pages deploy`) until now. Only on a
      # real push to main, never on a PR build, so opening a PR can't ship
      # someone's branch to production.
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Not a secret (account IDs aren't sensitive) — without this,
          # wrangler tries to resolve the account by listing memberships
          # via /memberships, which a narrowly-scoped token (Pages: Edit
          # only) can't do, and the deploy fails with an auth error before
          # it ever gets to actually deploying anything. First real deploy
          # attempt via CI failed exactly this way.
          CLOUDFLARE_ACCOUNT_ID: 0c31fb5956e72d68db423dce2e9dd62f
        run: npx wrangler pages deploy dist --project-name internez --branch main

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
        continue-on-error: true
