<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Envoy — InternEZ</title>
  <style>
    body { width: 280px; font-family: -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 16px; background: #ffffff; color: #0d1321; }
    h1 { font-size: 14px; font-weight: 700; margin: 0 0 10px; }
    p { font-size: 12px; color: #565d6b; line-height: 1.5; margin: 0 0 12px; }
    input { width: 100%; box-sizing: border-box; padding: 8px 10px; font-size: 12.5px; border: 1px solid #e3e5ea; border-radius: 3px; margin-bottom: 8px; font-family: inherit; }
    button { width: 100%; padding: 8px 12px; font-size: 13px; font-weight: 600; border-radius: 3px; border: 1.5px solid transparent; cursor: pointer; font-family: inherit; }
    .btn-primary { background: #16233f; color: #fff; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-ghost { background: none; border-color: #e3e5ea; color: #565d6b; margin-top: 8px; }
    .error { color: #d6362a; font-size: 11.5px; margin-top: 6px; }
    .status { font-size: 12px; color: #12875a; margin-top: 10px; line-height: 1.5; }
    .badge { display: inline-block; font-size: 11px; font-weight: 700; color: #12875a; background: #dff5ea; border: 1px solid #12875a; padding: 2px 8px; border-radius: 2px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>Envoy</h1>

  <div id="connect-view">
    <p>Paste the sync code from your InternEZ profile (Profile &gt; Browser extension) to connect Envoy to your profile.</p>
    <input id="token-input" type="text" placeholder="Sync code" autocomplete="off" />
    <button id="connect-btn" class="btn-primary">Connect</button>
    <p class="error" id="connect-error"></p>
  </div>

  <div id="ready-view" hidden>
    <span class="badge">Connected</span>
    <p>On an application page, click below and Envoy will fill in whatever it recognizes. Nothing submits automatically — review it yourself first.</p>
    <button id="fill-btn" class="btn-primary">Fill this page</button>
    <p class="status" id="status"></p>
    <button id="disconnect-btn" class="btn-ghost">Disconnect</button>
  </div>

  <script src="src/popup.js"></script>
</body>
</html>
